baseURL: /
theme: hugo-apero
languageCode: en
title: Harshvardhan
author: Harshvardhan
copyright: ''
googleAnalytics: 'G-N5CSPZ9H5M'
disqusShortname: ''
metaDataFormat: yaml
footnoteReturnLinkContents: '&#8617;'
paginate: 100
ignoreFiles:
  - \.Rmd$
  - \.Rmarkdown$
  - _cache$
  - \.knit\.md$
  - \.utf8\.md$
enableEmoji: true
markup:
  defaultMarkdownHandler: goldmark
  goldmark:
    parser:
      attribute:
        block: false
        title: false
    renderer:
      hardwraps: false
      unsafe: true
  highlight:
    style: github
  tableOfContents:
    endLevel: 2
    ordered: false
    startLevel: 2
params:
  custom_theme: ''
  customheadingFontFamily: "Lato"
  customtextFontFamily: "Libre Baskerville"
  description: Standing on the Shoulders of Giants
  favicon: /img/favicon.ico
  headingFontFamily: sans-serif
  logo: /img/avatar.png
  mainSections: ""
  math:
    renderer: katex
  navallcaps: true
  orgLocal: Anywhere
  orgName: Harshvardhan
  sharing_image: /img/sharing-image.png
  social:
    - icon: github
      icon_pack: fab
      url: https://github.com/harshvardhaniimi
    - icon: linkedin
      icon_pack: fab
      url: https://www.linkedin.com/in/harshvardhaniimi/
    - icon: threads
      icon_pack: fab
      url: https://www.threads.net/@harsh17.in
    - icon: orcid
      icon_pack: ai
      url: https://orcid.org/0000-0001-8086-544X
    - icon: graduation-cap
      icon_pack: fas
      url: https://scholar.google.com/citations?user=Q-dbCggAAAAJ&hl=en
    - icon: rss
      icon_pack: fas
      url: /blog/index.xml
  socialInFooter: true
  socialInHeader: false
  textFontFamily: sans-serif
  theme: paper
  utterances:
    issue_term: pathname # url, pathname or title
    label: "chit-chat :crystal_ball:"
    repo_name: "harshvardhaniimi/personal-website"
    theme: "boxy-light"
    use_utterances: true
taxonomies:
  category: categories
  series: series
  tag: tags
menu:
  footer:
    - name: License
      title: License
      url: /license/
      weight: 1
    - name: Contact
      title: Contact form
      url: https://forms.gle/htBcXP2pBMkMh8Zm6
      weight: 2
  header:
    - name: About
      title: About Me
      url: /about/
      weight: 1
    - name: Projects
      title: Data Projects
      url: /projects/
      weight: 2
    - name: Publications
      title: My Publications
      url: /publications/
      weight: 3
    - name: Talks
      title: Talks
      url: /talks/
      weight: 4
    - name: CV
      title: My CV
      url: https://www.harsh17.in/docs/cv.pdf
      weight: 5
    - name: Blog
      title: Blog
      url: https://blog.harsh17.in/
      weight: 6
    - name: Newsletter
      title: Next — Today I Learned About R
      url: https://harsh17.in/next
      weight: 7
privacy:
  disqus:
    disable: false
  googleAnalytics:
    anonymizeIP: true
    disable: false
    respectDoNotTrack: true
  instagram:
    disable: false
    simple: true
  x:
    disable: false
    enableDNT: true
    simple: false
  vimeo:
    disable: false
    enableDNT: true
    simple: true
  youtube:
    disable: false
    privacyEnhanced: true
permalinks:
  blog: /:slug/
  projects: /:slug/
  notes: /:slug/
  talks: /:slug/
  publications: /:slug/
  about: /:slug/

enableRobotsTXT: true

outputs:
  home:
    - HTML
    - RSS
    - Sitemap
